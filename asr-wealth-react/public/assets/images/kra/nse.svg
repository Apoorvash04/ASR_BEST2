<svg width="102" height="32" viewBox="0 0 102 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric Circular Octagon Emblem -->
  <g transform="translate(3, 4.5)">
    <!-- Outer segmented ring -->
    <circle cx="11.5" cy="11.5" r="11.5" fill="#E31E24"/>
    <!-- Top right segment in Navy -->
    <path d="M11.5 0C17.85 0 23 5.15 23 11.5H11.5V0Z" fill="#102554"/>
    <!-- Top left segment in Orange -->
    <path d="M0 11.5C0 5.15 5.15 0 11.5 0V11.5H0Z" fill="#F37023"/>
    <!-- Bottom left in Red -->
    <path d="M11.5 23C5.15 23 0 17.85 0 11.5H11.5V23Z" fill="#C8102E"/>
    <!-- Center faceted diamond in Yellow/Amber -->
    <polygon points="11.5,4 19,11.5 11.5,19 4,11.5" fill="#FFC800"/>
    <!-- Central white diamond -->
    <polygon points="11.5,7.5 15.5,11.5 11.5,15.5 7.5,11.5" fill="#FFFFFF"/>
  </g>
  <!-- NSE Bold Navy Text -->
  <text x="33" y="23.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="22" font-weight="900" fill="#102554" letter-spacing="0.5">NSE</text>
</svg>