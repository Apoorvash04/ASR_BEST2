<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="pmsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C20" />
      <stop offset="50%" stop-color="#212529" />
      <stop offset="100%" stop-color="#14171A" />
    </linearGradient>
    <pattern id="pmsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#pmsBgGrad)" />
  <rect width="800" height="1000" fill="url(#pmsGrid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="220" r="260" fill="none" stroke="rgba(93, 92, 231, 0.15)" stroke-width="1.5" />
  <circle cx="680" cy="220" r="190" fill="none" stroke="rgba(255, 219, 74, 0.12)" stroke-width="1" />
  <circle cx="120" cy="780" r="300" fill="none" stroke="rgba(93, 92, 231, 0.12)" stroke-width="1.5" />

  <!-- Dashed Target Frame -->
  <rect x="140" y="240" width="520" height="520" rx="20" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Center Graphic Icon -->
  <g transform="translate(400, 440)">
    <rect x="-50" y="-50" width="100" height="100" rx="20" fill="rgba(93, 92, 231, 0.20)" stroke="#5D5CE7" stroke-width="2" />
    <path d="M -28 22 L -8 -6 L 10 12 L 24 0 L 30 22 Z" fill="rgba(255, 219, 74, 0.5)" />
    <circle cx="18" cy="-14" r="8" fill="#FFDB4A" />
  </g>

  <!-- Labels -->
  <text x="400" y="555" font-family="'DM Sans', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    PMS Image Slot
  </text>
  <text x="400" y="592" font-family="'DM Sans', -apple-system, sans-serif" font-size="16" font-weight="400" fill="rgba(255, 255, 255, 0.65)" text-anchor="middle">
    Reserved space for your picture / infographic
  </text>

  <!-- Status Pill -->
  <rect x="300" y="635" width="200" height="34" rx="17" fill="rgba(255, 219, 74, 0.12)" stroke="rgba(255, 219, 74, 0.4)" stroke-width="1" />
  <text x="400" y="657" font-family="'DM Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFDB4A" text-anchor="middle" letter-spacing="0.5">
    Ready to Attach Picture
  </text>
</svg>
